spring:
  application:
    name: routine-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:routine_db}
    username: ${DB_USER:routine}
    password: ${DB_PASSWORD:routine_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none          # Schema do Flyway quản lý
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  address: "${SERVER_ADDRESS:::}"
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  jwt:
    # Đổi secret này trong production! Yêu cầu >= 64 ký tự Base64.
    secret: ${JWT_SECRET:RoutineSuperSecretKeyForGraduationProjectChangeMeInProduction20242025ABCDEF}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 7
    refresh-cookie-name: routine_refresh_token
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.routine: INFO
    org.hibernate.SQL: WARN
