services:
  # ==============================================================================
  # Database Service: PostgreSQL (local)
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: routine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-routine_db}
      POSTGRES_USER: ${DB_USER:-routine}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-routine_dev_password}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-routine} -d ${DB_NAME:-routine_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - routine_net

  # ==============================================================================
  # Backend Service: Spring Boot 3 + Java 17
  # Image được build từ source local trong ./backend
  # Kết nối tới PostgreSQL trong mạng Compose
  # ==============================================================================
  backend:
    image: routine-backend:local
    pull_policy: build
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: routine-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-routine_db}
      DB_USER: ${DB_USER:-routine}
      DB_PASSWORD: ${DB_PASSWORD:-routine_dev_password}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-RoutineSuperSecretKeyForGraduationProjectChangeMeInProduction20242025ABCDEF}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v3/api-docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - routine_net

  # ==============================================================================
  # Frontend Service: ReactJS + Nginx Alpine (Reverse Proxy /api/ -> Backend)
  # Image được build từ source local trong ./frontend
  # ==============================================================================
  frontend:
    image: routine-frontend:local
    pull_policy: build
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: routine-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - routine_net

# ==============================================================================
# Persistent Volumes & Networks
# ==============================================================================
volumes:
  postgres_data:
    name: routine_postgres_data

networks:
  routine_net:
    name: routine_network
    driver: bridge
