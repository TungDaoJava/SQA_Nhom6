name: Manually Build and Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag to publish
        required: false
        default: latest
        type: string
env:
  REGISTRY: ghcr.io
  # Use the repository that started this workflow, so forks publish to their
  # own GHCR namespace instead of the upstream repository's namespace.
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/routine-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/routine-frontend

jobs:
  build-and-push-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,format=short

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,format=short

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-summary:
    name: Show published image URLs
    runs-on: ubuntu-latest
    needs:
      - build-and-push-backend
      - build-and-push-frontend

    steps:
      - name: Echo published image URLs
        run: |
          echo "Backend image URL: ${{ env.BACKEND_IMAGE }}:${{ inputs.tag }}"
          echo "Frontend image URL: ${{ env.FRONTEND_IMAGE }}:${{ inputs.tag }}"
          {
            echo "## Published Docker images"
            echo "- Backend: \`${{ env.BACKEND_IMAGE }}:${{ inputs.tag }}\`"
            echo "- Frontend: \`${{ env.FRONTEND_IMAGE }}:${{ inputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
